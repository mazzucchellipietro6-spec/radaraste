# Generato da `npm run headers` a partire da src/lib/security-headers.mjs: non modificare a mano.
[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    content-security-policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com https://plausible.io https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://www.google-analytics.com https://www.googletagmanager.com https://avatars.githubusercontent.com; font-src 'self'; connect-src 'self' https://challenges.cloudflare.com https://plausible.io https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://api.github.com; frame-src https://challenges.cloudflare.com https://www.openstreetmap.org; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https://checkout.stripe.com https://github.com; frame-ancestors 'none'; upgrade-insecure-requests"
    x-content-type-options = "nosniff"
    x-frame-options = "DENY"
    referrer-policy = "strict-origin-when-cross-origin"
    permissions-policy = "camera=(self), microphone=(), geolocation=(), payment=(self \"https://checkout.stripe.com\"), interest-cohort=()"
    cross-origin-opener-policy = "same-origin"
    strict-transport-security = "max-age=63072000; includeSubDomains; preload"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/admin/*"
  [headers.values]
    x-robots-tag = "noindex, nofollow"

# Ogni giorno raccoglie le aste dalle fonti ufficiali e ripubblica il sito su GitHub Pages.
# Prerequisito (una volta sola): Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Aggiorna aste e pubblica il sito

on:
  schedule:
    - cron: '17 4 * * *'   # ogni giorno alle 04:17 UTC (06:17 ora legale italiana)
  workflow_dispatch:        # avvio manuale dal tab Actions
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    # raccolta (~5 min) + storico (~2 min) + fino a 600 dettagli del PVP, uno ogni 3 s (~35 min)
    timeout-minutes: 110
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test dei calcoli
        run: npm test

      - id: pages
        uses: actions/configure-pages@v5

      # Se una fonte non risponde, il programma conserva le aste reali raccolte il giorno prima:
      # per questo scarica il file pubblicato in precedenza (se esiste).
      - name: Recupera i dati pubblicati in precedenza
        run: curl -fsSL "${{ steps.pages.outputs.base_url }}/data/aste.js" -o data/aste.js || echo "Nessuna pubblicazione precedente"

      # Indice storico delle vendite passate (serve per i tentativi, NON si pubblica) e schede a pezzi con i
      # dettagli già letti: si conservano da un giorno all'altro nella cache delle Actions. La chiave cambia a ogni
      # esecuzione (run_id), quindi si ripristina sempre la più recente (restore-keys) e se ne salva una nuova.
      # Se la cache manca la raccolta riparte: ricostruisce l'indice e arricchisce un po' alla volta.
      - name: Ripristina indice storico e schede a pezzi
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/storico-indice.json
            data/dettagli/
          key: aste-arricchimento-${{ github.run_id }}
          restore-keys: |
            aste-arricchimento-

      # Senza cache, le schede già pubblicate sul sito valgono come punto di partenza (dettagli già letti).
      - name: Recupera le schede pubblicate (se la cache manca)
        if: steps.cache.outputs.cache-matched-key == ''
        run: |
          mkdir -p data/dettagli
          for i in $(seq 0 127); do
            k=$(printf '%02x' "$i")
            curl -fsSL "${{ steps.pages.outputs.base_url }}/data/dettagli/$k.js" -o "data/dettagli/$k.js" || rm -f "data/dettagli/$k.js"
          done
          echo "Schede recuperate: $(ls data/dettagli | wc -l)"

      - id: raccolta
        name: Raccogli le aste dalle fonti ufficiali
        continue-on-error: true
        run: node scripts/raccogli.mjs --max-dettagli 600 --tempo-max 85

      - name: Salva indice storico e schede a pezzi
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/storico-indice.json
            data/dettagli/
          key: aste-arricchimento-${{ github.run_id }}

      - name: Prepara il sito
        run: |
          mkdir -p _site/data
          cp -r *.html manifest.webmanifest sw.js assets config js _site/
          # data/: tutto (aste.js, riepilogo.js, geo.js, italia.js, dettagli/) TRANNE l'indice storico, che è una
          # cache della raccolta e non si pubblica, e i file temporanei
          find data -mindepth 1 -maxdepth 1 ! -name 'storico-indice.json*' ! -name '*.tmp' -exec cp -r {} _site/data/ \;
          find _site/data -name '*.tmp' -delete
          test ! -e _site/data/storico-indice.json
          echo "Schede pubblicate: $(ls _site/data/dettagli 2>/dev/null | wc -l) pezzi"
          sed -i "s/__VERSIONE__/${GITHUB_SHA::8}-$(date -u +%Y%m%d)/" _site/sw.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Segnala se la raccolta è fallita
        if: steps.raccolta.outcome == 'failure'
        run: |
          echo "::error::La raccolta delle aste non è riuscita per nessuna fonte: il sito è stato pubblicato con lo stato delle fonti aggiornato. Controlla il log del passo 'Raccogli le aste'."
          exit 1
